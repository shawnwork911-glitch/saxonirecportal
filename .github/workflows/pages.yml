# Publishes the website (frontend folder) to GitHub Pages on every push to main.
# One-time: Settings > Pages > Source: GitHub Actions. No secrets are used or allowed here.
name: Publish website
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to publish anything that looks like a secret
        run: |
          if grep -rIiE "client_secret|clientSecret[\"' ]*[:=]|IREC_CLIENT_SECRET|BEGIN (RSA )?PRIVATE KEY" frontend --exclude-dir=vendor; then
            echo "Something that looks like a secret is in the website. It is public: remove it."; exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - id: deployment
        uses: actions/deploy-pages@v4
